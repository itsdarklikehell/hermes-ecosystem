name: Gource visualization

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # weekly
  # No `push` trigger: build-pages commits generated artifacts to main daily,
  # and every one of those pushes re-rendered the whole timeline. The render is
  # expensive and its output only changes meaningfully week to week.

jobs:
  gource:
    name: Generate Gource video
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Input names must match the action's own schema exactly. The previous
      # hyphenated names (gource-video-length, hide-mouse, camera-mode, ...)
      # were not recognised, so every one of them was silently dropped and the
      # render ran with defaults.
      - name: Generate Gource video
        uses: nbprojekt/gource-action@v1.3.0
        with:
          gource_title: 'Hermes Atlas development timeline'
          gource_camera_mode: 'overview'
          gource_hide_items: 'mouse,date,filenames'
          gource_key: 'true'
          gource_seconds_per_day: '1.0'

      # The action writes its result to gource/gource.mp4 (not ./gource.mp4).
      # Do not rely on ffmpeg being present in the runner image either —
      # install it explicitly so the step cannot fail with
      # "ffmpeg: command not found" (exit 127).
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Re-encode with ffmpeg
        run: |
          test -f gource/gource.mp4
          ffmpeg -y -i gource/gource.mp4 -c:v libx264 -preset slow -crf 18 \
            -pix_fmt yuv420p -vf "scale=1920:1080" \
            -c:a aac -b:a 192k -movflags +faststart \
            hermes-ecosystem_gource_1080p.mp4

      - name: Upload Gource video
        uses: actions/upload-artifact@v5
        with:
          name: gource-video
          path: hermes-ecosystem_gource_1080p.mp4
          retention-days: 90

      - name: Upload video to release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: hermes-ecosystem_gource_1080p.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
