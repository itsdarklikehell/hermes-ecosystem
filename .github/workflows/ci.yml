name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # This repo has no build step — it is a static site generated by the
      # scheduled build-pages workflow, not a compiled app. The previous
      # `npm run build` referenced a script that does not exist in
      # package.json and failed every run with "Missing script: build".
      - name: Test
        run: npm test
